server:
  port: 8081

spring:
  application:
    name: ds-auth
  profiles:
    active: dev
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: dev
      config:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: dev
        file-extension: yml

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: off

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    com.ds: INFO

