server:
  port: 8083

spring:
  application:
    name: ds-product
  profiles:
    active: dev
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: dev
      config:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: dev
        file-extension: yml

  # 毒消息兜底：反序列化失败的消息直接丢弃，不再无限重投（否则会刷满日志并拖垮服务）
  rabbitmq:
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: off

resilience4j:
  circuitbreaker:
    instances:
      productRead:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
  retry:
    instances:
      productRead:
        maxRetries: 2
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        waitDuration: 500ms

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    com.ds: INFO

