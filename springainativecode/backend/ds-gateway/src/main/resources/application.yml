server:
  port: 8080

spring:
  application:
    name: ds-gateway
  profiles:
    active: dev
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: dev
      config:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: dev
        file-extension: yml

    gateway:
      discovery:
        locator:
          enabled: false   # 不用自动发现；显式路由
          lower-case-service-id: true
      routes:
        - id: ds-auth
          uri: lb://ds-auth
          predicates:
            - Path=/auth/**
        - id: ds-user
          uri: lb://ds-user
          predicates:
            - Path=/users/**
        - id: ds-product
          uri: lb://ds-product
          predicates:
            - Path=/products/**
          filters:
            - name: CircuitBreaker
              args:
                group: product
                fallbackUri: 'forward:/fallback/product'
                name: productBreaker
            - name: Retry
              args:
                retries: 2
                statuses: BAD_GATEWAY, SERVICE_UNAVAILABLE

      httpclient:
        connect-timeout: 3000
        response-timeout: 30s   # 默认 10s 太紧：Pod 刚启动的第一个请求经常 >1s

resilience4j:
  ratelimiter:
    instances:
      gateway:
        limitForPeriod: 100
        limitRefreshPeriod: 1s
        timeoutDuration: 0
  # 关键：网关 CircuitBreaker 默认 TimeLimiter 只有 1 秒，
  # 下游冷启动（首个请求 1~3s）会被当成超时 → 直接走 fallback，
  # 结果就是“接口返回 405/503，但数据已经写进库”。这里放宽到 10s。
  timelimiter:
    instances:
      productBreaker:
        timeoutDuration: 10s
        cancelRunningFuture: true
  circuitbreaker:
    instances:
      productBreaker:
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s

knife4j:
  gateway:
    enabled: true
    routes:
      - name: 认证服务
        service-name: ds-auth
        url: http://127.0.0.1:8081/v3/api-docs
      - name: 用户服务
        service-name: ds-user
        url: http://127.0.0.1:8082/v3/api-docs
      - name: 商品服务
        service-name: ds-product
        url: http://127.0.0.1:8083/v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.ds: INFO

