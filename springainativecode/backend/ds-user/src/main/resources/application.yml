server:
  port: 8082

spring:
  application:
    name: ds-user
  profiles:
    active: dev
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: dev
      config:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: dev
        file-extension: yml

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: off

feign:
  client:
    config:
      default:
        connectTimeout: 3000
        readTimeout: 5000

resilience4j:
  ratelimiter:
    instances:
      userRead:
        limitForPeriod: 100
        limitRefreshPeriod: 1s
        timeoutDuration: 0

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    com.ds: INFO

