---
# ds-gateway（NodePort 暴露，前端 Nginx 反代到它）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ds-gateway
  namespace: ds
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ds-gateway
  template:
    metadata:
      labels:
        app: ds-gateway
    spec:
      imagePullSecrets:
        - name: harbor-creds
      containers:
        - name: ds-gateway
          image: 172.17.1.1:5000/ds/ds-gateway:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: nacos-client
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: k8s
            - name: SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR
              value: nacos.ds.svc:8848
            - name: SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR
              value: nacos.ds.svc:8848
            - name: SPRING_REDIS_HOST
              value: redis.ds.svc
            - name: SPRING_REDIS_PORT
              value: "6379"
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits:   { cpu: "1", memory: 1Gi }
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: ds-gateway
  namespace: ds
spec:
  type: NodePort
  selector:
    app: ds-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080

















