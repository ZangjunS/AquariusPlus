# 后端 4 个服务：统一模板，每个 Deployment + Service + Nacos 客户端注册
# Nacos 配置通过 K8s Secret 注入（实际部署时把 4 个 yml 写进 Secret）

---
# 公共 ConfigMap：nacos 客户端公共参数
apiVersion: v1
kind: ConfigMap
metadata:
  name: nacos-client
  namespace: ds
data:
  NACOS_ADDR: "nacos.ds.svc:8848"
  NACOS_NAMESPACE: "dev"

---
# ds-auth
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ds-auth
  namespace: ds
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ds-auth
  template:
    metadata:
      labels:
        app: ds-auth
    spec:
      imagePullSecrets:
        - name: harbor-creds
      containers:
        - name: ds-auth
          image: 172.17.1.1:5000/ds/ds-auth:latest
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: nacos-client
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: k8s
            - name: SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR
              value: nacos.ds.svc:8848
            - name: SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR
              value: nacos.ds.svc:8848
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres.ds.svc:5432/ds?currentSchema=ds&stringtype=unspecified
            - name: SPRING_DATASOURCE_USERNAME
              value: ds
            - name: SPRING_DATASOURCE_PASSWORD
              value: ds123456
            - name: SPRING_REDIS_HOST
              value: redis.ds.svc
            - name: SPRING_REDIS_PORT
              value: "6379"
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits:   { cpu: "1", memory: 1Gi }
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: ds-auth
  namespace: ds
spec:
  selector:
    app: ds-auth
  ports:
    - name: http
      port: 8081
      targetPort: 8081

