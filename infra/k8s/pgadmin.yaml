# pgAdmin 4 —— Postgres 图形化管理工具（基础设施，非业务服务）
# 定位：给 ds 库做可视化运维（看表/改数据/执行 SQL），和 postgres 一起属于「基础设施」阶段
# 端口：集群内 ClusterIP pgadmin:80；对外由 expose.yaml 的 pgadmin-ext 暴露为 NodePort 30083
# 镜像：只引用私有仓库（宿主机 docker pull dpage/pgadmin4:<tag> → tag → push 172.17.1.1:5000/ds/pgadmin4:<tag>）
# 登录：admin@ds.com / admin123（首次启动由 PGADMIN_DEFAULT_* 创建）
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pgadmin-data
  namespace: ds
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgadmin
  namespace: ds
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgadmin
  template:
    metadata:
      labels:
        app: pgadmin
    spec:
      imagePullSecrets:
        - name: harbor-creds
      securityContext:
        runAsUser: 5050
        runAsGroup: 5050
        fsGroup: 5050
      containers:
        - name: pgadmin
          image: 172.17.1.1:5000/ds/pgadmin4:8
          imagePullPolicy: IfNotPresent
          env:
            - name: PGADMIN_DEFAULT_EMAIL
              value: admin@ds.com
            - name: PGADMIN_DEFAULT_PASSWORD
              value: admin123
            - name: PGADMIN_CONFIG_SERVER_MODE
              value: "True"
            - name: PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED
              value: "False"
            # 离线环境：关掉升级检查，避免外网请求拖慢启动
            - name: PGADMIN_CONFIG_UPGRADE_CHECK_ENABLED
              value: "False"
            - name: PGADMIN_DISABLE_POSTFIX
              value: "1"
            - name: TZ
              value: Asia/Shanghai
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgadmin
          # 首次启动要在卷上初始化 pgadmin4.db，可能 1~3 分钟才监听 80；
          # startupProbe 先兜住（最长 5 分钟），通过后才启用 liveness/readiness，避免初始化期被误杀
          startupProbe:
            httpGet:
              path: /misc/ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /misc/ping
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /misc/ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pgadmin-data
---
apiVersion: v1
kind: Service
metadata:
  name: pgadmin
  namespace: ds
spec:
  selector:
    app: pgadmin
  ports:
    - name: http
      port: 80
      targetPort: http
