# 前端 Nginx 镜像
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ds-web
  namespace: ds
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ds-web
  template:
    metadata:
      labels:
        app: ds-web
    spec:
      imagePullSecrets:
        - name: harbor-creds
      containers:
        - name: ds-web
          image: 172.17.1.1:5000/ds/ds-web:latest
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 200m, memory: 128Mi }
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ds-web
  namespace: ds
spec:
  type: NodePort
  selector:
    app: ds-web
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30081






