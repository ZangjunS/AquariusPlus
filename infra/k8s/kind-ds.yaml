# kind 集群配置：ds-kind
# 用途：本地验证 DS 微服务
#   30080 网关 / 30081 前端 / 30082 Dashboard
#   30432 Postgres / 30679 Redis / 30672 RabbitMQ(AMQP) / 30972 RabbitMQ(管理台)
#   30848 Nacos(HTTP) / 30849 Nacos(gRPC 9848) / 30990 Jenkins
# 注意：NodePort 只有在建集群时就做 extraPortMappings 才能从宿主机（WSL/Windows）访问；
#       集群已存在时新增端口只能重建集群，或用 docker 端口桥接（见 DEPLOY-SPEC.md）
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ds-kind
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
      - containerPort: 30081
        hostPort: 30081
        protocol: TCP
      - containerPort: 30082
        hostPort: 30082
        protocol: TCP
      - containerPort: 30432
        hostPort: 30432
        protocol: TCP
      - containerPort: 30679
        hostPort: 30679
        protocol: TCP
      - containerPort: 30672
        hostPort: 30672
        protocol: TCP
      - containerPort: 30972
        hostPort: 30972
        protocol: TCP
      - containerPort: 30848
        hostPort: 30848
        protocol: TCP
      - containerPort: 30849
        hostPort: 30849
        protocol: TCP
      - containerPort: 30990
        hostPort: 30990
        protocol: TCP
