# 基础设施端口对外暴露（NodePort）——本文件是部署流程的必需一步
# 说明：
#   1) 集群内服务互相访问仍走 ClusterIP（postgres.ds.svc / redis.ds.svc / rabbitmq.ds.svc / nacos.ds.svc），
#      本文件只是把同样的后端额外开放成 NodePort，方便宿主机/Navicat/DBeaver/浏览器直接连。
#   2) NodePort 范围避开已被占用的 30080（网关）、30081（前端）、30082（Dashboard）。
#   3) Jenkins 跑在 Docker 容器里（不是 Pod），用「无 selector 的 Service + 手工 Endpoints」把宿主端口纳进来。
#      172.17.1.1 是 kind 节点容器的网关（即 WSL 宿主侧的 docker 网桥地址），节点能路由到。
#   4) kind 集群必须建集群时就把这些端口写进 extraPortMappings（见 kind-ds.yaml），
#      否则 NodePort 只能在集群内部/节点 IP 上访问，宿主机连不上。
apiVersion: v1
kind: Service
metadata:
  name: postgres-ext
  namespace: ds
  labels:
    app: postgres
    expose: nodeport
spec:
  type: NodePort
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      nodePort: 30432
---
apiVersion: v1
kind: Service
metadata:
  name: redis-ext
  namespace: ds
  labels:
    app: redis
    expose: nodeport
spec:
  type: NodePort
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      nodePort: 30679
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-ext
  namespace: ds
  labels:
    app: rabbitmq
    expose: nodeport
spec:
  type: NodePort
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
      nodePort: 30672
    - name: mgmt
      port: 15672
      targetPort: 15672
      nodePort: 30972
---
apiVersion: v1
kind: Service
metadata:
  name: nacos-ext
  namespace: ds
  labels:
    app: nacos
    expose: nodeport
spec:
  type: NodePort
  selector:
    app: nacos
  ports:
    - name: http
      port: 8848
      targetPort: 8848
      nodePort: 30848
    - name: client-rpc
      port: 9848
      targetPort: 9848
      nodePort: 30849
---
# pgAdmin：Postgres 图形化客户端，浏览器打开 http://127.0.0.1:30083（admin@ds.com / admin123）
apiVersion: v1
kind: Service
metadata:
  name: pgadmin-ext
  namespace: ds
  labels:
    app: pgadmin
    expose: nodeport
spec:
  type: NodePort
  selector:
    app: pgadmin
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30083
---
# Jenkins：Docker 容器 ds-jenkins，宿主端口 8090。Service 无 selector，endpoints 手工指向宿主网关
apiVersion: v1
kind: Service
metadata:
  name: jenkins-ext
  namespace: ds
  labels:
    app: jenkins
    expose: nodeport
spec:
  type: NodePort
  ports:
    - name: http
      port: 8090
      targetPort: 8090
      nodePort: 30990
---
apiVersion: v1
kind: Endpoints
metadata:
  name: jenkins-ext
  namespace: ds
  labels:
    app: jenkins
subsets:
  - addresses:
      - ip: 172.17.1.1
    ports:
      - name: http
        port: 8090
